services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: circuitstock-app
    working_dir: /var/www/html
    volumes: 
      - .:/var/www/html
    tty: true
    ports:
     - "8000:8000"

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: circuitstock
      POSTGRES_USER: circuitstock
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: